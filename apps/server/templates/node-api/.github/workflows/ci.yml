name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci: # required check on main (Blackbox enable_ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm test
      - run: docker build -t app .
