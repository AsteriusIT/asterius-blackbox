name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci: # required check on main (Blackbox enable_ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: dotnet build -c Release
      - run: docker build -t app .
