apiVersion: v1
kind: Namespace
metadata:
  name: blackbox-system
---
# Kaniko build jobs run here, with the registry push secret.
apiVersion: v1
kind: Namespace
metadata:
  name: blackbox-builds
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: builds
  namespace: blackbox-builds
spec:
  hard:
    pods: "6"
    limits.cpu: "12"
    limits.memory: 24Gi
