# The platform (not the agent) talks to the cluster. The agent has no kubeconfig and can only use the
# platform's tools, which act exclusively on namespaces labelled app.kubernetes.io/managed-by=asterius-blackbox.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blackbox
  namespace: blackbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blackbox-environments
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [secrets, services, resourcequotas, limitranges]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blackbox-environments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: blackbox-environments
subjects:
  - kind: ServiceAccount
    name: blackbox
    namespace: blackbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blackbox-builds
  namespace: blackbox-builds
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blackbox-builds
  namespace: blackbox-builds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blackbox-builds
subjects:
  - kind: ServiceAccount
    name: blackbox
    namespace: blackbox-system
# Tighten further with a ValidatingAdmissionPolicy that rejects writes by this SA to namespaces
# lacking the managed-by label (see docs/ARCHITECTURE.md).
