apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blackbox-data
  namespace: blackbox-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
  namespace: blackbox-system
spec:
  replicas: 1 # single writer: SQLite + agent workspaces on the PVC
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: blackbox }
  template:
    metadata:
      labels: { app: blackbox }
    spec:
      serviceAccountName: blackbox
      securityContext: { fsGroup: 10001 }
      containers:
        - name: blackbox
          image: myregistry.azurecr.io/asterius-blackbox:latest
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - secretRef: { name: blackbox-secrets } # ANTHROPIC_API_KEY, ADO_ADMIN_PAT, ADO_AGENT_GIT_PAT, NOTIFY_WEBHOOK_URL
            - configMapRef: { name: blackbox-config }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "4", memory: 8Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: blackbox-data }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: blackbox-system
data:
  PUBLIC_URL: https://blackbox.example.com
  GIT_PROVIDER: azure-devops
  ADO_ORG_URL: https://dev.azure.com/my-org
  ADO_PROJECT: Blackbox
  K8S_ENABLED: "true"
  K8S_IMAGE_REGISTRY: myregistry.azurecr.io/blackbox
  K8S_BASE_DOMAIN: preview.example.com
  K8S_CLUSTER_ISSUER: letsencrypt
  ALLOW_REGISTRATION: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox
  namespace: blackbox-system
spec:
  selector: { app: blackbox }
  ports: [{ port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blackbox
  namespace: blackbox-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # SSE
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls: [{ hosts: [blackbox.example.com], secretName: blackbox-tls }]
  rules:
    - host: blackbox.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: blackbox, port: { number: 80 } } }
